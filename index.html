<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinician Success Hub</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-mark" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
              <rect x="1" y="1" width="32" height="32" rx="10" stroke="url(#logoStroke)" stroke-width="2"/>
              <path d="M10 17h14M17 10v14" stroke="url(#logoStroke)" stroke-width="2.6" stroke-linecap="round"/>
              <defs>
                <linearGradient id="logoStroke" x1="4" y1="4" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#22D3EE"/>
                  <stop offset="1" stop-color="#A3E635"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div>
            <div class="logo-text">Clinician Success Hub</div>
            <div class="logo-sub">Adoption Intelligence</div>
          </div>
        </div>
        <div class="account-name">Midwest Regional Health System</div>
      </div>
      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-item active" data-view="dashboard">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="8" height="8" rx="2"></rect>
              <rect x="13" y="3" width="8" height="8" rx="2"></rect>
              <rect x="3" y="13" width="8" height="8" rx="2"></rect>
              <rect x="13" y="13" width="8" height="8" rx="2"></rect>
            </svg>
          </span>
          Dashboard
        </a>
        <a href="#/departments" class="nav-item" data-view="departments">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16v16H4z"></path>
              <path d="M4 9h16"></path>
              <path d="M9 9v11"></path>
            </svg>
          </span>
          Departments
        </a>
        <a href="#/champions" class="nav-item" data-view="champions">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16l-4.9 2.2.9-5.5-4-3.9 5.5-.8L12 3z"></path>
            </svg>
          </span>
          Champions
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="status-pill">
          <span class="status-dot live"></span>
          System Online
        </div>
        <div class="last-updated">Last updated: Feb 5, 2026</div>
      </div>
    </aside>
    <div class="app-body">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Operational Command</div>
          <div class="topbar-sub">Live adoption signals and clinician momentum</div>
        </div>
        <div class="topbar-actions">
          <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.5-3.5"></path>
            </svg>
            <input type="search" placeholder="Search clinicians, departments, or signals" aria-label="Search">
          </div>
          <button class="ghost-btn" type="button">Export</button>
          <div class="user-chip">
            <div class="user-avatar">IR</div>
            <div class="user-meta">
              <div class="user-name">Innovation Team</div>
              <div class="user-role">Adoption Ops</div>
            </div>
          </div>
        </div>
      </header>
      <main class="main-content" id="main-content">
        <!-- Views render here -->
      </main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
